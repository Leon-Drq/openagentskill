<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">From idea to shipped. — original Code stories sample</title><style>text{font-family:system-ui,sans-serif}g{transform-box:fill-box;transform-origin:center}.rise{animation:rise 8s cubic-bezier(.2,.7,.2,1) 1 both}.float{animation:float 8s ease-in-out 1 both}.spin{animation:spin 8s ease-in-out 1 both}.turn{animation:turn 8s cubic-bezier(.2,.7,.2,1) 1 both}.orbit{animation:orbit 8s ease-in-out 1 both}.grow{transform-origin:center bottom;animation:grow 8s ease 1 both}.draw{animation:draw 8s ease 1 both}.bounce{animation:bounce 8s ease-in-out 1 both}.nod{animation:nod 8s ease-in-out 1 both}.wave{animation:wave 8s ease-in-out 1 both}@keyframes rise{0%{opacity:0;transform:translateY(38px)}13%,87%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}@keyframes float{0%{opacity:0;transform:translateY(30px)}5%{opacity:1;transform:translateY(0)}55%{transform:translateY(-18px)}100%{opacity:1;transform:translateY(0)}}@keyframes spin{0%{transform:rotate(-24deg) scale(.8);opacity:0}16%{opacity:1}100%{transform:rotate(80deg) scale(1);opacity:1}}@keyframes turn{0%{transform:rotate(-95deg) scale(.2);opacity:0}23%{transform:rotate(10deg) scale(1.05);opacity:1}45%{transform:rotate(0) scale(1)}75%{transform:rotate(90deg)}100%{transform:rotate(180deg);opacity:1}}@keyframes orbit{0%{opacity:0;transform:scale(.25) rotate(-30deg)}25%{opacity:1;transform:scale(1) rotate(0)}100%{transform:scale(1) rotate(26deg);opacity:1}}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}@keyframes draw{0%{stroke-dashoffset:1600}55%,100%{stroke-dashoffset:0}}@keyframes bounce{0%,30%,100%{transform:translateY(0)}42%{transform:translateY(10px) scaleY(.96)}57%{transform:translateY(-42px)}73%{transform:translateY(0)}}@keyframes nod{0%,35%,100%{transform:rotate(0)}48%{transform:rotate(-10deg)}65%{transform:rotate(6deg)}}@keyframes wave{0%{transform:scaleY(.12);opacity:0}16%{opacity:1;transform:scaleY(.7)}32%{transform:scaleY(1)}48%{transform:scaleY(.3)}64%{transform:scaleY(.9)}80%{transform:scaleY(.4)}100%{transform:scaleY(.75);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1280" height="800" fill="#F4EADD"/><text x="72" y="70" font-size="19.00" fill="#212E32" font-weight="600">OpenAgentSkill</text><text x="1208" y="70" font-size="15.00" fill="#212E32" text-anchor="end" letter-spacing="1">Code stories</text><path d="M72 105L1208 105" fill="none" stroke="#212E32" stroke-opacity=".24" /><g class="rise" style="animation-delay:0s"><text x="73" y="252" font-size="66.00" fill="#212E32" font-weight="600" letter-spacing="-4">From idea</text></g><g class="rise" style="animation-delay:0.18s"><text x="73" y="322.62" font-size="61.54" fill="#212E32" font-weight="600" letter-spacing="-4">to shipped.</text></g><text x="76" y="532" font-size="23.00" fill="#212E32" >A command. A possibility.</text><g class="rise" style="animation-delay:0s"><g transform="translate(555 190)"><rect x="0" y="0" width="650" height="398" rx="16" fill="#212E32" /><text x="28" y="43" font-size="19.00" fill="#212E32" style="fill:#F4EADD">~/studio</text><path d="M0 68L650 68" fill="none" stroke="#212E32" stroke-opacity=".24" style="stroke:#F4EADD"/><g class="rise" style="animation-delay:0s"><text x="28" y="118" font-size="19.00" fill="#212E32" font-family="monospace" style="fill:#F4EADD">$ create something meaningful</text></g><g class="rise" style="animation-delay:0.25s"><text x="28" y="161" font-size="19.00" fill="#212E32" font-family="monospace" style="fill:#F4EADD">  → finding the right shape</text></g><g class="rise" style="animation-delay:0.5s"><text x="28" y="204" font-size="19.00" fill="#212E32" font-family="monospace" style="fill:#F4EADD">  → setting things in motion</text></g><g class="rise" style="animation-delay:0.75s"><text x="28" y="247" font-size="19.00" fill="#212E32" font-family="monospace" style="fill:#F4EADD">  → making room for your ideas</text></g><g class="rise" style="animation-delay:1s"><text x="28" y="290" font-size="19.00" fill="#212E32" font-family="monospace" style="fill:#F4EADD"></text></g><g class="rise" style="animation-delay:1.25s"><text x="28" y="333" font-size="19.00" fill="#212E32" font-family="monospace" style="fill:#F4EADD">✓ Ready to make it yours</text></g></g></g><path d="M72 696L1208 696" fill="none" stroke="#212E32" stroke-opacity=".24" /><text x="72" y="739" font-size="15.00" fill="#212E32" >Original motion study</text><text x="1208" y="739" font-size="14.00" fill="#212E32" text-anchor="end" letter-spacing="1">122 / MOTION STUDIES</text></svg>