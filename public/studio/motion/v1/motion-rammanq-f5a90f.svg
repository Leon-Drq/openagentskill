<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">Small screen. Big ideas. — original Mobile showcases sample</title><style>text{font-family:system-ui,sans-serif}g{transform-box:fill-box;transform-origin:center}.rise{animation:rise 8s cubic-bezier(.2,.7,.2,1) 1 both}.float{animation:float 8s ease-in-out 1 both}.spin{animation:spin 8s ease-in-out 1 both}.turn{animation:turn 8s cubic-bezier(.2,.7,.2,1) 1 both}.orbit{animation:orbit 8s ease-in-out 1 both}.grow{transform-origin:center bottom;animation:grow 8s ease 1 both}.draw{animation:draw 8s ease 1 both}.bounce{animation:bounce 8s ease-in-out 1 both}.nod{animation:nod 8s ease-in-out 1 both}.wave{animation:wave 8s ease-in-out 1 both}@keyframes rise{0%{opacity:0;transform:translateY(38px)}13%,87%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}@keyframes float{0%{opacity:0;transform:translateY(30px)}5%{opacity:1;transform:translateY(0)}55%{transform:translateY(-18px)}100%{opacity:1;transform:translateY(0)}}@keyframes spin{0%{transform:rotate(-24deg) scale(.8);opacity:0}16%{opacity:1}100%{transform:rotate(80deg) scale(1);opacity:1}}@keyframes turn{0%{transform:rotate(-95deg) scale(.2);opacity:0}23%{transform:rotate(10deg) scale(1.05);opacity:1}45%{transform:rotate(0) scale(1)}75%{transform:rotate(90deg)}100%{transform:rotate(180deg);opacity:1}}@keyframes orbit{0%{opacity:0;transform:scale(.25) rotate(-30deg)}25%{opacity:1;transform:scale(1) rotate(0)}100%{transform:scale(1) rotate(26deg);opacity:1}}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}@keyframes draw{0%{stroke-dashoffset:1600}55%,100%{stroke-dashoffset:0}}@keyframes bounce{0%,30%,100%{transform:translateY(0)}42%{transform:translateY(10px) scaleY(.96)}57%{transform:translateY(-42px)}73%{transform:translateY(0)}}@keyframes nod{0%,35%,100%{transform:rotate(0)}48%{transform:rotate(-10deg)}65%{transform:rotate(6deg)}}@keyframes wave{0%{transform:scaleY(.12);opacity:0}16%{opacity:1;transform:scaleY(.7)}32%{transform:scaleY(1)}48%{transform:scaleY(.3)}64%{transform:scaleY(.9)}80%{transform:scaleY(.4)}100%{transform:scaleY(.75);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1280" height="800" fill="#F3DCD7"/><text x="72" y="70" font-size="19.00" fill="#442A38" font-weight="600">OpenAgentSkill</text><text x="1208" y="70" font-size="15.00" fill="#442A38" text-anchor="end" letter-spacing="1">Mobile showcases</text><path d="M72 105L1208 105" fill="none" stroke="#442A38" stroke-opacity=".24" /><g class="rise" style="animation-delay:0s"><text x="72" y="303" font-size="52.07" fill="#442A38" font-weight="600" letter-spacing="-4">Small screen.</text></g><g class="rise" style="animation-delay:0.18s"><text x="72" y="385.39" font-size="67.69" fill="#442A38" font-weight="600" letter-spacing="-4">Big ideas.</text></g><text x="76" y="522" font-size="24.00" fill="#442A38" >Designed for the everyday.</text><g class="float" style="animation-delay:0s"><g transform="translate(835 144) rotate(9 125 250)"><rect x="0" y="0" width="250" height="498" rx="37" fill="#442A38" /><rect x="10" y="10" width="230" height="478" rx="28" fill="#B75163" /><rect x="80" y="22" width="90" height="23" rx="12" fill="#F3DCD7" /><text x="32" y="95" font-size="16.00" fill="#442A38" style="fill:#FFFFFF">09:41</text><text x="30" y="166" font-size="28.00" fill="#442A38" font-weight="600" style="fill:#FFFFFF">A good day</text><circle cx="124" cy="254" r="70" fill="#F3DCD7" /><text x="91" y="267" font-size="35.00" fill="#442A38" >72°</text><rect x="27" y="352" width="196" height="14" rx="7" fill="#F3DCD7" /><rect x="27" y="384" width="169" height="14" rx="7" fill="#F3DCD7" /><rect x="27" y="416" width="142" height="14" rx="7" fill="#F3DCD7" /></g></g><g class="rise" style="animation-delay:0.4s"><g transform="translate(690 365)"><rect x="0" y="0" width="230" height="112" rx="16" fill="#F3DCD7" stroke="#442A38" stroke-opacity=".18"/><circle cx="35" cy="40" r="12" fill="#B75163" /><text x="57" y="45" font-size="18.00" fill="#442A38" >A fresh start</text><text x="24" y="84" font-size="16.00" fill="#442A38" >Make room for more.</text></g></g><path d="M72 696L1208 696" fill="none" stroke="#442A38" stroke-opacity=".24" /><text x="72" y="739" font-size="15.00" fill="#442A38" >Original motion study</text><text x="1208" y="739" font-size="14.00" fill="#442A38" text-anchor="end" letter-spacing="1">184 / MOTION STUDIES</text></svg>