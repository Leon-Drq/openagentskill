<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">Meet your next idea. — original Product films sample</title><style>text{font-family:system-ui,sans-serif}g{transform-box:fill-box;transform-origin:center}.rise{animation:rise 8s cubic-bezier(.2,.7,.2,1) 1 both}.float{animation:float 8s ease-in-out 1 both}.spin{animation:spin 8s ease-in-out 1 both}.turn{animation:turn 8s cubic-bezier(.2,.7,.2,1) 1 both}.orbit{animation:orbit 8s ease-in-out 1 both}.grow{transform-origin:center bottom;animation:grow 8s ease 1 both}.draw{animation:draw 8s ease 1 both}.bounce{animation:bounce 8s ease-in-out 1 both}.nod{animation:nod 8s ease-in-out 1 both}.wave{animation:wave 8s ease-in-out 1 both}@keyframes rise{0%{opacity:0;transform:translateY(38px)}13%,87%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}@keyframes float{0%{opacity:0;transform:translateY(30px)}5%{opacity:1;transform:translateY(0)}55%{transform:translateY(-18px)}100%{opacity:1;transform:translateY(0)}}@keyframes spin{0%{transform:rotate(-24deg) scale(.8);opacity:0}16%{opacity:1}100%{transform:rotate(80deg) scale(1);opacity:1}}@keyframes turn{0%{transform:rotate(-95deg) scale(.2);opacity:0}23%{transform:rotate(10deg) scale(1.05);opacity:1}45%{transform:rotate(0) scale(1)}75%{transform:rotate(90deg)}100%{transform:rotate(180deg);opacity:1}}@keyframes orbit{0%{opacity:0;transform:scale(.25) rotate(-30deg)}25%{opacity:1;transform:scale(1) rotate(0)}100%{transform:scale(1) rotate(26deg);opacity:1}}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}@keyframes draw{0%{stroke-dashoffset:1600}55%,100%{stroke-dashoffset:0}}@keyframes bounce{0%,30%,100%{transform:translateY(0)}42%{transform:translateY(10px) scaleY(.96)}57%{transform:translateY(-42px)}73%{transform:translateY(0)}}@keyframes nod{0%,35%,100%{transform:rotate(0)}48%{transform:rotate(-10deg)}65%{transform:rotate(6deg)}}@keyframes wave{0