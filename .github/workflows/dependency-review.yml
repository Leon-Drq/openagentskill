name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Review dependency changes
        uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4
        with:
          fail-on-severity: high
