name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Review dependency changes
        uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4
        with:
          fail-on-severity: high
