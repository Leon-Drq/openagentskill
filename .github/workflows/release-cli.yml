name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$GITHUB_REF_NAME" = "cli-v$VERSION"
      - name: Run CLI contract test
        run: pnpm run test:cli
      - name: Pack CLI artifact
        run: mkdir -p dist && pnpm --dir packages/cli pack --pack-destination ../../dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --generate-notes --title "OpenAgentSkill CLI ${GITHUB_REF_NAME#cli-v}"
