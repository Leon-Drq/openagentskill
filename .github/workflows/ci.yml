name: CI

on:
  deployment_status:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A later Vercel event for the same commit replaces the earlier run. Every
  # event runs real checks with fixed names; skipped deployment jobs must never
  # shadow the checks required by main's branch protection.
  group: ci-${{ github.workflow }}-${{ github.event.deployment.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Check repository links
        run: pnpm run test:links

  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run regression and contract tests
        run: pnpm test
      - name: Verify read-only agent connection and source eligibility
        run: node --experimental-strip-types scripts/test-agent-connection.mjs

  build:
    name: Production build
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production application
        run: pnpm run build
