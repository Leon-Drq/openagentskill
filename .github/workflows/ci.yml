name: CI

on:
  deployment_status:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.deployment.sha || github.ref }}-${{ github.event.deployment.environment || '' }}-${{ github.event.deployment_status.state || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  gallery-gate:
    name: Select CI source
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/select-gallery-ci.mjs
  quality:
    name: ${{ needs.gallery-gate.outputs.selected == 'true' && 'Lint and typecheck' || 'Gallery event (lint not applicable)' }}
    needs: gallery-gate
    if: needs.gallery-gate.outputs.selected == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Check repository links
        run: pnpm run test:links

  tests:
    name: ${{ needs.gallery-gate.outputs.selected == 'true' && 'Regression tests' || 'Gallery event (tests not applicable)' }}
    needs: gallery-gate
    if: needs.gallery-gate.outputs.selected == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run regression and contract tests
        run: pnpm test
      - name: Verify read-only agent connection and source eligibility
        run: node --experimental-strip-types scripts/test-agent-connection.mjs

  build:
    name: ${{ needs.gallery-gate.outputs.selected == 'true' && 'Production build' || 'Gallery event (build not applicable)' }}
    needs: [gallery-gate, quality, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production application
        run: pnpm run build
