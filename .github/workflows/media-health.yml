name: External media health

on:
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-media-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit all published remote images and videos
        run: pnpm media:audit --remote
      - name: Preserve media health report, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skill-media-audit
          path: artifacts/skill-media-audit.json
          if-no-files-found: error
          retention-days: 30
