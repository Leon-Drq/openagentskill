name: Cloudflare migration validation

on:
  push:
    branches: [main, codex/cloudflare-migration, codex/repair-cloudflare-ingestion, codex/fix-indexnow-delivery, codex/fix-indexnow-worker-request]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:links
      - run: pnpm test
      - run: pnpm test:cloudflare
      - name: Validate authentication in workerd with an isolated local D1 database
        run: node scripts/check-cloudflare-auth-runtime.mjs
      - name: Validate business permissions and search in native D1
        run: node scripts/check-cloudflare-business-runtime.mjs
      - run: node --experimental-strip-types scripts/test-agent-connection.mjs
      - name: Build Cloudflare application without production credentials
        run: pnpm cf:build
      - name: Validate Worker packaging without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir .codex-tmp/worker-dry-run
      - name: Validate production bindings and packaging without deploying
        run: pnpm exec wrangler deploy --config wrangler.production.jsonc --dry-run
      - name: Exercise public routes in the Workers runtime
        run: node scripts/check-cloudflare-preview.mjs
      - name: Package portable build output
        run: |
          tar --exclude='*/node_modules' --exclude='.open-next/assets' -czf cloudflare-runtime.tar.gz .open-next
          tar -czf cloudflare-static.tar.gz .open-next/assets/_next .open-next/assets/BUILD_ID
          tar -czf cloudflare-worker.tar.gz .codex-tmp/worker-dry-run
          git rev-parse HEAD > cloudflare-build-commit.txt
      - name: Upload tested build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-build-${{ github.sha }}
          path: |
            cloudflare-runtime.tar.gz
            cloudflare-static.tar.gz
            cloudflare-worker.tar.gz
            cloudflare-build-commit.txt
          retention-days: 3
      - name: Upload runtime check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-smoke-${{ github.sha }}
          path: |
            .codex-tmp/cloudflare-preview.log
            .codex-tmp/cloudflare-smoke.json
          retention-days: 3
